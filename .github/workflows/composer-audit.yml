name: Composer Audit
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: composer-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  composer-audit:
    name: Locked dependencies and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Validate package manifests
        run: |
          composer validate --strict
          composer validate --strict -d vendor-bin/phpunit
          composer validate --strict -d vendor-bin/phpstan
          composer validate --strict -d vendor-bin/php-cs-fixer
      - name: Audit all locked dependencies
        run: |
          php tools/check-composer-audit.php
          composer audit --locked --no-interaction -d vendor-bin/phpunit
          composer audit --locked --no-interaction -d vendor-bin/phpstan
          composer audit --locked --no-interaction -d vendor-bin/php-cs-fixer
