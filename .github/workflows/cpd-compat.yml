name: CPD pinned source contract
on:
  push:
    paths:
      - 'modules/cpd/**'
      - '.github/workflows/cpd-compat.yml'
      - 'src/StandardLargeObjectFacade.php'
  pull_request:
    paths:
      - 'modules/cpd/**'
      - '.github/workflows/cpd-compat.yml'
      - 'src/StandardLargeObjectFacade.php'
permissions:
  contents: read
jobs:
  pinned-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned public CPD files (disposable)
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/e-cidade/e-cidade-CPD.git "$RUNNER_TEMP/cpd-synthetic"
          git -C "$RUNNER_TEMP/cpd-synthetic" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/cpd-synthetic" sparse-checkout set --no-cone /std/DBLargeObject.php /std/Modification.php /FrontController.php /index.php /DBFileUpload.php
          git -C "$RUNNER_TEMP/cpd-synthetic" checkout --detach 39cce22ed59cda56edbbeb3b746e692ab7d66fcb
      - name: Verify shared pinned source and CPD bootstrap
        run: |
          php bin/integrator.php verify-pinned cpd "$RUNNER_TEMP/cpd-synthetic"
          php modules/cpd/verify-upstream.php "$RUNNER_TEMP/cpd-synthetic"
      - name: Assert legacy PHP 5.6 syntax in isolated container
        run: |
          docker run --rm --network none -v "$PWD:/sdk:ro" -w /sdk --entrypoint sh php:5.6-cli@sha256:6ce95208609dc66df163ab936c970b3b34cd901b85c747102c5999f08ade9143 -c "php -l modules/cpd/verify-upstream.php && php -l modules/cpd/DBLargeObject.php && php -l src/PinnedCheckoutVerifier.php && php -l src/AdapterRegistry.php"
