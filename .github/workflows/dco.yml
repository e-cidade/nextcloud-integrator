name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  dco:
    name: DCO sign-off
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify DCO on each commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: php tools/check-commits.php --dco "origin/$BASE_REF" HEAD
