#
# Compare public PINNED fork PHP methods and native PostgreSQL LO behavior.
# No ERP/customer DB, Nextcloud credential, real dataset, or external service.
# Native PostgreSQL LO is intentionally exercised ONLY to observe the legacy
# return/transaction contract, not as an implementation of the new storage.
name: Pinned fork source runtime contracts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: "${{ matrix.fork }} PHP ${{ matrix.php }} native source"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - fork: dbseller
            php: '5.6'
            repository: e-cidade-DBSeller
            commit: 7fab5ac38b19dbd842ca81a259186c613c90f3c1
            source: ecidade/std/DBLargeObject.php
          - fork: contass
            php: '7.4'
            repository: e-cidade-Contass
            commit: 90081bf22993292ad197134fe1617cace968a984
            source: std/DBLargeObject.php
          - fork: cpd
            php: '5.6'
            repository: e-cidade-CPD
            commit: 39cce22ed59cda56edbbeb3b746e692ab7d66fcb
            source: std/DBLargeObject.php
    services:
      synthetic-pg:
        image: postgres:11@sha256:5d2aa4a7b5f9bdadeddcf87cf7f90a176737a02a30d917de4ab2e6a329bd2d45
        env:
          POSTGRES_DB: ecidade_synthetic_test
          POSTGRES_USER: mvp_test
          POSTGRES_PASSWORD: synthetic-only-fork-native-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mvp_test -d ecidade_synthetic_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ECIDADE_SYNTHETIC_FORK_CONTRACT: '1'
      ECIDADE_INTEGRATOR_ROOT: ${{ github.workspace }}
      ECIDADE_ADAPTER: ${{ matrix.fork }}
      PGHOST: 127.0.0.1
      PGDATABASE: ecidade_synthetic_test
      PGUSER: mvp_test
      PGPASSWORD: synthetic-only-fork-native-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, curl
          coverage: none
      - name: Fetch only pinned public original PHP file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fork-original"
          git -C "$RUNNER_TEMP/fork-original" init -q
          git -C "$RUNNER_TEMP/fork-original" remote add origin "https://github.com/e-cidade/${{ matrix.repository }}.git"
          git -C "$RUNNER_TEMP/fork-original" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/fork-original" sparse-checkout set --no-cone "/${{ matrix.source }}"
          if [ "${{ matrix.fork }}" = dbseller ]; then
            source_model=ecidade/model/protocolo/ProcessoDocumento.model.php
          else
            source_model=model/protocolo/ProcessoDocumento.model.php
          fi
          git -C "$RUNNER_TEMP/fork-original" sparse-checkout add "/$source_model"
          if [ "${{ matrix.fork }}" = dbseller ]; then
            git -C "$RUNNER_TEMP/fork-original" sparse-checkout add \
              /ecidade/classes/db_protprocessodocumento_classe.php
          elif [ "${{ matrix.fork }}" = cpd ]; then
            git -C "$RUNNER_TEMP/fork-original" sparse-checkout add \
              /classes/db_protprocessodocumento_classe.php
          fi
          git -C "$RUNNER_TEMP/fork-original" fetch --depth 1 --filter=blob:none origin "${{ matrix.commit }}"
          git -C "$RUNNER_TEMP/fork-original" checkout --quiet --detach FETCH_HEAD
      - name: Confirm exact revision and immutable source fingerprint
        run: php bin/integrator.php verify-pinned "${{ matrix.fork }}" "$RUNNER_TEMP/fork-original"
      - name: Compare original public method signatures and replacement
        run: |
          php tests/upstream/facade-signature.php \
            "$RUNNER_TEMP/fork-original/${{ matrix.source }}" \
            "modules/${{ matrix.fork }}/DBLargeObject.php"
      - name: Exercise untouched original class against disposable PostgreSQL
        run: |
          php tests/upstream/native-large-object-contract.php \
            "${{ matrix.fork }}" \
            "$RUNNER_TEMP/fork-original/${{ matrix.source }}"
      - name: Exercise original facade signatures through shared SPI and SQL outbox
        run: php tests/upstream/spi-facade-contract.php "${{ matrix.fork }}"
      - name: Exercise pinned Protocolo original business methods through shared SPI
        run: |
          if [ "${{ matrix.fork }}" = dbseller ]; then
            source_model=ecidade/model/protocolo/ProcessoDocumento.model.php
          else
            source_model=model/protocolo/ProcessoDocumento.model.php
          fi
          php tests/upstream/protocolo-model-contract.php \
            "$RUNNER_TEMP/fork-original/$source_model" \
            "${{ matrix.fork }}"
      - name: Characterize pinned generated DAO and legacy E-Storage regression
        if: matrix.fork != 'contass'
        run: |
          if [ "${{ matrix.fork }}" = dbseller ]; then
            prefix=ecidade/
          else
            prefix=
          fi
          php tests/upstream/protocolo-generated-dao-contract.php \
            "$RUNNER_TEMP/fork-original/${prefix}model/protocolo/ProcessoDocumento.model.php" \
            "$RUNNER_TEMP/fork-original/${prefix}classes/db_protprocessodocumento_classe.php" \
            "${{ matrix.fork }}" legacy
      - name: Test unmerged DBSeller correction on original PHP 5.6 DAO
        if: matrix.fork == 'dbseller'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dbseller-pr2-preview"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/e-cidade/e-cidade-DBSeller.git
          git -C "$root" sparse-checkout init --no-cone
          git -C "$root" sparse-checkout set --no-cone /ecidade/model/protocolo/ProcessoDocumento.model.php
          git -C "$root" fetch --depth 1 --filter=blob:none origin 2a17b7ad3cacffacdce9dfb52679c60a54ee3836
          git -C "$root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = 2a17b7ad3cacffacdce9dfb52679c60a54ee3836
          php tests/upstream/protocolo-generated-dao-contract.php \
            "$root/ecidade/model/protocolo/ProcessoDocumento.model.php" \
            "$RUNNER_TEMP/fork-original/ecidade/classes/db_protprocessodocumento_classe.php" \
            dbseller fixed
