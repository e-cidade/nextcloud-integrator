name: PHPStan
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phpstan:
    name: Static analysis level 4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install isolated locked PHPStan
        run: composer install -d vendor-bin/phpstan --no-interaction --prefer-dist --no-progress
      - name: Analyze
        run: php vendor-bin/phpstan/vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=1G
