name: Secret Scanning
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks source and history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan working tree, no network
        run: docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/scan:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir --no-banner --redact=100 --log-level error /scan
      - name: Scan commit history, no network
        run: docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/scan:ro" -w /scan ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --no-banner --redact=100 --log-level error --log-opts="--all --full-history" /scan
