name: ecidade-integrator-cli

services:
  cli:
    image: php:8.3-cli@sha256:600bce7c7acf524756e5aac989f4a763aed709960d7326970bb670f46efee53a
    working_dir: /sdk
    entrypoint: ["php", "/sdk/bin/integrator.php"]
    network_mode: none
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./:/sdk
